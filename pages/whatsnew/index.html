<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What's new</title>
  <link rel="stylesheet" href="whatsnew.css">
  <link id="aeroTheme" rel="stylesheet" href="aero://themes/_active/newtab.css">
</head>
<body>
  <div class="sun"></div>
  <main>
    <header class="glass hero">
      <div class="orb-logo"></div>
      <div>
        <p class="kicker" id="kicker">Aero Browser updated</p>
        <h1 id="headline">What's new</h1>
        <p id="sub"></p>
      </div>
    </header>

    <section id="latest" class="cards"></section>

    <div class="actions">
      <a class="gel" href="aero://newtab/">Start browsing</a>
    </div>

    <details class="glass older">
      <summary>Earlier updates</summary>
      <div id="older"></div>
    </details>
  </main>

  <script src="changelog.js"></script>
  <script src="whatsnew.js"></script>
</body>
</html>
