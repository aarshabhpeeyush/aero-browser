<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Frutiger Metro: big flat tiles and bold diagonal bands, with a little gloss. White only, laid
       over the theme's bright colours (from Aquaris's CSS underneath). -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="0.51" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- bold diagonal bands -->
  <path d="M-200 1080 L700 -100 L980 -100 L80 1080 Z" fill="url(#band)"/>
  <path d="M500 1080 L1400 -100 L1520 -100 L620 1080 Z" fill="#fff" fill-opacity="0.1"/>
  <path d="M1300 1080 L2200 -100 L2400 -100 L1500 1080 Z" fill="url(#band)"/>
  <!-- a cluster of tiles, like a Start screen -->
  <g transform="translate(1240 220)">
    <rect width="250" height="250" fill="#fff" fill-opacity="0.16"/>
    <rect x="262" width="120" height="120" fill="#fff" fill-opacity="0.22"/>
    <rect x="262" y="130" width="120" height="120" fill="#fff" fill-opacity="0.1"/>
    <rect y="262" width="382" height="120" fill="#fff" fill-opacity="0.13"/>
    <rect x="394" y="130" width="250" height="252" fill="#fff" fill-opacity="0.08"/>
    <rect width="250" height="250" fill="url(#gloss)"/>
  </g>
  <g transform="translate(140 640)">
    <rect width="120" height="120" fill="#fff" fill-opacity="0.18"/>
    <rect x="130" width="250" height="120" fill="#fff" fill-opacity="0.1"/>
    <rect y="130" width="250" height="120" fill="#fff" fill-opacity="0.12"/>
  </g>
  <!-- a bright streak of light -->
  <path d="M0 980 C 500 900, 1100 1000, 1920 860 L1920 880 C 1100 1020, 500 930, 0 1000 Z" fill="#fff" fill-opacity="0.45"/>
</svg>
