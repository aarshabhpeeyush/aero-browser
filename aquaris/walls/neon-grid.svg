<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Neon Gamer: a synthwave night, a neon grid floor running to the horizon, a striped sun,
       mountains in outline and RGB light streaks -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05040b"/>
      <stop offset="0.55" stop-color="#1a0726"/>
      <stop offset="0.62" stop-color="#3a0a3c"/>
      <stop offset="1" stop-color="#07050d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.5" stop-color="#ff3d7f"/>
      <stop offset="1" stop-color="#b00cff"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07050d" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#07050d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1f5a"/>
      <stop offset="0.33" stop-color="#b00cff"/>
      <stop offset="0.66" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#39ff88"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="stripes">
      <rect x="0" y="0" width="1920" height="545"/>
      <rect x="0" y="560" width="1920" height="20"/>
      <rect x="0" y="592" width="1920" height="14"/>
    </clipPath>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="160" cy="120" r="1.6" opacity="0.8"/><circle cx="420" cy="60" r="1.2" opacity="0.6"/><circle cx="700" cy="180" r="1.4" opacity="0.7"/>
    <circle cx="1100" cy="90" r="1.2" opacity="0.6"/><circle cx="1350" cy="200" r="1.6" opacity="0.8"/><circle cx="1650" cy="70" r="1.3" opacity="0.7"/>
    <circle cx="1820" cy="240" r="1.2" opacity="0.5"/><circle cx="560" cy="300" r="1.1" opacity="0.5"/><circle cx="260" cy="380" r="1.3" opacity="0.6"/>
  </g>
  <!-- the striped sun -->
  <circle cx="960" cy="560" r="230" fill="url(#sun)" clip-path="url(#stripes)" filter="url(#glow)"/>
  <!-- mountains, outlined in neon -->
  <path d="M0 640 L180 520 L300 600 L470 470 L640 640 Z" fill="#0b0614" stroke="#00e5ff" stroke-width="2" filter="url(#glow)"/>
  <path d="M1240 640 L1420 500 L1560 590 L1720 460 L1920 640 Z" fill="#0b0614" stroke="#ff1f5a" stroke-width="2" filter="url(#glow)"/>
  <!-- the neon floor: lines running to the horizon -->
  <rect x="0" y="640" width="1920" height="440" fill="#07050d"/>
  <g stroke="#ff2bd6" stroke-width="2" opacity="0.85" filter="url(#glow)">
    <path d="M960 640 L-1400 1080 M960 640 L-700 1080 M960 640 L-160 1080 M960 640 L320 1080 M960 640 L720 1080 M960 640 L960 1080 M960 640 L1200 1080 M960 640 L1600 1080 M960 640 L2080 1080 M960 640 L2620 1080 M960 640 L3320 1080"/>
    <path d="M0 652 H1920 M0 670 H1920 M0 696 H1920 M0 734 H1920 M0 790 H1920 M0 870 H1920 M0 990 H1920"/>
  </g>
  <rect x="0" y="640" width="1920" height="440" fill="url(#fade)"/>
  <!-- the horizon line, in RGB -->
  <rect x="0" y="638" width="1920" height="4" fill="url(#rgb)" filter="url(#glow)"/>
  <!-- RGB light streaks across the sky -->
  <path d="M-50 330 C 500 280, 1300 380, 1980 300" stroke="url(#rgb)" stroke-width="3" fill="none" opacity="0.55" filter="url(#glow)"/>
</svg>
