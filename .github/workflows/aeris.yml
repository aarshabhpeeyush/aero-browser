# Builds Aeris (our Firefox-based browser) for Windows on GitHub's computers.
# Start it from the Actions tab, or with: gh workflow run aeris.yml
name: Build Aeris

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MOZBUILD_STATE_PATH: /mnt/mozbuild
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_CACHE_SIZE: 9G
      MOZ_PARALLEL_BUILD: 3
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false

      - name: Workspace and swap on the big drive
        run: |
          sudo mkdir -p /mnt/aeris /mnt/mozbuild
          sudo chown -R "$USER" /mnt/aeris /mnt/mozbuild
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h / /mnt
          free -h

      - name: Download Firefox source
        run: |
          version=$(cat aeris/firefox-version.txt)
          curl -fsSL "https://archive.mozilla.org/pub/firefox/releases/$version/source/firefox-$version.source.tar.xz" \
            | tar -xJ -C /mnt/aeris
          mv "/mnt/aeris/firefox-$version" /mnt/aeris/src

      - name: Turn it into Aeris
        run: |
          pip install --quiet pillow
          bash aeris/prepare.sh /mnt/aeris/src windows

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Get build tools
        working-directory: /mnt/aeris/src
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q msitools libc6-i386 lib32gcc-s1 lib32stdc++6
          ./mach --no-interactive bootstrap --application-choice browser
          rustup target add x86_64-pc-windows-msvc

      - name: Build
        working-directory: /mnt/aeris/src
        # Lower priority, so GitHub's own runner program never gets starved and drops the job.
        run: nice -n 10 ./mach build

      - name: Package
        working-directory: /mnt/aeris/src
        run: |
          sudo apt-get install -y -q p7zip-full
          ./mach package
          ls -la obj-aeris/dist/
          mkdir -p /mnt/aeris/firefox
          cp obj-aeris/dist/aeris-*.win64.installer.exe obj-aeris/dist/aeris-*.win64.zip /mnt/aeris/firefox/
          sccache --show-stats || true

      - name: Keep the finished browser
        uses: actions/upload-artifact@v4
        with:
          name: aeris-browser
          path: /mnt/aeris/firefox/*
          retention-days: 14

      - name: Aeris setup
        run: |
          version=$(cat aeris/version.txt)
          numver=${version%%-*}
          python3 -c "from PIL import Image; Image.open('build/icon.png').save('/mnt/aeris/aeris.ico', sizes=[(16,16),(32,32),(48,48),(256,256)])"
          # The setup copies the browser itself (Firefox's own installer would ask for admin rights)
          mkdir -p /mnt/aeris/app && unzip -q -o /mnt/aeris/firefox/aeris-*.win64.zip -d /mnt/aeris/app
          mkdir -p /mnt/aeris/out
          makensis=$(command -v makensis || ls /mnt/mozbuild/nsis*/bin/makensis | head -1)
          echo "makensis: $makensis"
          curl -fsSL https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi -o /mnt/aeris/ublock.xpi
          "$makensis" -V2 -DUBLOCK=/mnt/aeris/ublock.xpi -DVERSION="$version" -DNUMVER="$numver" -DAPPDIR=/mnt/aeris/app/aeris -DICON=/mnt/aeris/aeris.ico             -DOUT="/mnt/aeris/out/Aeris-Setup-$version.exe" aeris/installer/aeris-setup.nsi
          ls -la /mnt/aeris/out

      - uses: actions/upload-artifact@v4
        with:
          name: aeris-win64
          path: /mnt/aeris/out/*
          retention-days: 14

      - name: Keep the build log if something broke
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aeris-logs
          path: |
            /mnt/aeris/src/obj-aeris/config.log
            /mnt/aeris/src/obj-aeris/.mozbuild/last_log.json
          if-no-files-found: ignore
