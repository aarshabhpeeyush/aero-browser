# The Aquaris iPad app. The Xcode project is made from this file (xcodegen) on GitHub's Macs,
# see .github/workflows/aquaris-ipad.yml.
name: AquarisShell
options:
  bundleIdPrefix: app.aeris
  deploymentTarget:
    iOS: "16.0"
targets:
  Aquaris:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: web
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Aquaris
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Game controllers: Aquaris uses them as a mouse (see PadCursor)
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        NSCameraUsageDescription: Apps in Aquaris (like Zoom and Discord) can use the camera when you allow it.
        NSMicrophoneUsageDescription: Apps in Aquaris (like Zoom and Discord) can use the microphone when you allow it.
        NSPhotoLibraryUsageDescription: So you can pick photos to send or edit in Aquaris apps.
        NSPhotoLibraryAddUsageDescription: So Aquaris apps can save pictures to your Photos.
    settings:
      base:
        PRODUCT_NAME: Aquaris
        PRODUCT_BUNDLE_IDENTIFIER: app.aeris.aquaris
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
